{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş Yap - TÜMOSAN Bütçe Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tumosan-red: #c81e2c;
            --tumosan-dark: #8f0f1a;
        }
        body {
            background: linear-gradient(135deg, var(--tumosan-dark), var(--tumosan-red));
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        .login-card img {
            display: block;
            margin: 0 auto 1rem auto;
            height: 60px;
        }
        .login-card h4 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2b2b2b;
        }
        .btn-primary {
            background-color: var(--tumosan-red);
            border-color: var(--tumosan-red);
        }
        .btn-primary:hover {
            background-color: var(--tumosan-dark);
            border-color: var(--tumosan-dark);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="{% static 'images/tumosan_logo.png' %}" alt="TÜMOSAN">
        <h4>TÜMOSAN Bütçe Sistemi</h4>
        {% if form.errors %}
        <div class="alert alert-danger">Kullanıcı adı veya şifre hatalı.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
