<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TÜMOSAN Bütçe Yönetim Sistemi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
    body { background-color: #f4f6f9; }
    .navbar-brand { font-weight: 600; }
    .card { border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .navbar .nav-link:hover,
    .navbar .btn-outline-light:hover {
        color: #fff !important;
        text-decoration: underline;
        opacity: 0.85;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#0d3b66;">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">TÜMOSAN Bütçe Sistemi</a>
            <div>
    <a class="nav-link text-white d-inline mx-4" href="{% url 'dashboard' %}">Panel</a>
    <a class="nav-link text-white d-inline mx-4" href="{% url 'budget_list' %}">Bütçeler</a>
    <a class="nav-link text-white d-inline mx-4" href="{% url 'variance_report' %}">Sapma Analizi</a>
    <a class="nav-link text-white d-inline mx-4" href="/admin/">Yönetim</a>
    <form method="post" action="{% url 'logout' %}" class="d-inline mx-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light btn-sm">Çıkış ({{ request.user.username }})</button>
    </form>
</div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
