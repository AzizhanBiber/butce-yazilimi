{% extends "budgets/base.html" %}
{% block title %}Bildirimler{% endblock %}
{% block content %}
<h2 class="mb-4">Bildirimler</h2>
<div class="list-group">
    {% for n in notes %}
    <div class="list-group-item d-flex justify-content-between align-items-center" style="{% if not n.is_read %}background-color: #fff3cd; border-left: 5px solid #e0a800;{% else %}background-color: #f5f5f5; opacity: 0.6;{% endif %}">
        <a href="{% url 'open_notification' n.pk %}" class="text-decoration-none" style="color: #212529; flex-grow: 1; {% if not n.is_read %}font-weight: bold;{% endif %}">
            {% if not n.is_read %}🔵 YENİ —{% else %}✅ Okundu —{% endif %} {{ n.message }}
            <div class="small text-muted">{{ n.created_at }}</div>
        </a>
        <a href="{% url 'delete_notification' n.pk %}" class="btn btn-sm btn-outline-danger ms-2" onclick="return confirm('Bu bildirim silinsin mi?')">Sil</a>
    </div>
    {% empty %}
    <div class="list-group-item">Henüz bildirim yok.</div>
    {% endfor %}
</div>
{% endblock %}
